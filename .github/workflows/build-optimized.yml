name: Build Intelligent Villagers Optimized
on:
  push:
    paths:
      - 'optimized-mod/**'
      - '.github/workflows/build-optimized.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimized-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IntelligentVillagers-Optimized
          path: optimized-mod/build/libs/*-optimized.jar
