plugins {
    id 'net.minecraftforge.gradle' version '6.0.25' apply false
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0-optimized'
group = 'com.minikkurtcuk.aivillager'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { aivillager { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { aivillager { source sourceSets.main } } }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
}

jar { archiveBaseName = 'IntelligentVillagers-Optimized'; finalizedBy 'reobfJar' }

reobf { jar {} }

processResources {
    var replaceProperties = [minecraft_version: '1.20.1', minecraft_version_range: '[1.20.1,1.21)', forge_version: '47.4.20', forge_version_range: '[47.4.20,48)', loader_version_range: '[47,)', mod_id: 'aivillager', mod_name: 'Intelligent Villagers Optimized', mod_license: 'MIT', mod_version: project.version, mod_authors: 'Minik Kurtcuk', mod_description: 'Performance-focused intelligent village simulation for Minecraft 1.20.1.' ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml','pack.mcmeta']) { expand replaceProperties }
}
